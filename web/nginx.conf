server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://api:3100/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_buffering off;
    proxy_read_timeout 3600s;
  }

  location /health {
    proxy_pass http://api:3100/health;
  }

  location /internal/ {
    return 403;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
